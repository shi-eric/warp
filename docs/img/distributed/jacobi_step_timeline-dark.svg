  <text x="172" y="490" font-size="10.5" fill="#999999">Each barrier_all is a one-thread kernel; every PE waits in it for the slowest.</text>
  <text x="400" y="521" text-anchor="middle" font-size="10.5" fill="#999999">Box widths show order and overlap, not measured durations. The two-stream form needs a second stream and two events per step.</text>
  <text x="400" y="539" text-anchor="middle" font-size="10.5" fill="#999999">The barrier loop captures after an eager warm-up; the two-stream loop also needs the step number on the device to replay.</text>
